services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      retries: 12

  odoo:
    image: odoo:18
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - .:/mnt/extra-addons/my_module
    # Creates the database "erp" on the first run and installs the module. Later runs just start it.
    command: odoo -d erp --db-filter=^erp$ -i my_module --without-demo=all

volumes:
  pgdata:
